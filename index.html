<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할 일 목록</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <!-- 중앙 카드 애플리케이션 메인 컨테이너 -->
  <main class="todo-card">
    <!-- 헤더 / 앱 제목 -->
    <header class="todo-header">
      <h1 class="todo-title">📝 나의 할 일 목록</h1>
      <!-- 할 일 개수 통계 배지 -->
      <div class="todo-stats">
        <span class="stat-badge">전체 <strong id="total-count">0</strong>개</span>
        <span class="stat-badge completed">완료 <strong id="completed-count">0</strong>개</span>
      </div>
    </header>

    <!-- 할 일 입력 폼 영역 -->
    <div class="input-section">
      <input type="text" id="todo-input" class="todo-input" placeholder="할 일을 입력하세요" autocomplete="off">
      <button id="add-btn" class="add-btn">추가</button>
    </div>

    <!-- 필터링 및 완료 항목 일괄 삭제 영역 -->
    <div class="filter-section">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="active">진행중</button>
        <button class="filter-btn" data-filter="completed">완료</button>
      </div>
      <button id="clear-completed-btn" class="clear-completed-btn">완료 항목 삭제</button>
    </div>

    <!-- 할 일 목록 영역 (비어 있음) -->
    <div class="list-section">
      <ul id="todo-list" class="todo-list">
        <!-- 등록된 할 일이 없을 때 비어 있음 -->
      </ul>
      
      <!-- 목록이 비어있을 때 안내 문구 -->
      <div id="empty-state" class="empty-state">
        <p>등록된 할 일이 없습니다.</p>
        <span class="empty-subtext">새로운 할 일을 입력해 보세요!</span>
      </div>

      <!-- 모든 할 일 완료 시 표시되는 축하 배너 -->
      <div id="all-completed-banner" class="all-completed-banner hidden">
        <span class="party-icon">🎉</span>
        <p class="banner-title">오늘 할 일 끝! 내일도 파이팅!</p>
      </div>
    </div>
  </main>
</body>
</html>
